version: '3.7'

services:
  postgres:
    image: postgres:15.13-alpine3.22
    container_name: POSTGRES_DB
    restart: always
    environment:
      - POSTGRES_DB=${PG_DB}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWD}
    ports:
      - "5432:5432"
    networks:
      - prisma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  app:
    container_name: app
    build: ./
    restart: always
    depends_on:
      - postgres
    networks:
      - prisma-network
    ports:
      - ${PORT}:4000
    environment:
      PG_HOST: postgres
networks:
  prisma-network:

volumes:
  postgres_data:


